<title id="title">TypeShift — typing speed checker</title><desc id="desc">Oversized A, S, and return keycaps sit beside a words-per-minute unit label and an unnumbered measurement scale. The A key gently depresses. This is illustrative artwork, not a reported typing score.</desc>
